name: Firmware CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit resolved by the release workflow
        type: string
        default: ''
    outputs:
      commit:
        value: ${{ jobs.firmware.outputs.commit }}
      artifact:
        value: ${{ jobs.firmware.outputs.artifact }}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # A later push may select fewer duties than its predecessor. Do not cancel
  # or replace that predecessor's queued checks; PR diffs cover their whole base.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && inputs.source_ref == '' }}
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact: firmware-${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select validation duties
        id: scope
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 scripts/ci_scope.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: steps.scope.outputs.rust_crates != ''
        with:
          toolchain: 1.98.0
          targets: ${{ steps.scope.outputs.portable_crates != '' && 'wasm32-unknown-unknown' || '' }}
      - name: Cache Cargo sources and tools
        if: steps.scope.outputs.rust_crates != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: firmware-v1-sources
          # canoe-provision creates sparse templates. Target archives expand
          # their holes and exhaust small runners, so rebuild target outputs.
          cache-targets: false
          workspaces: |
            tools/mode2-profile -> target
            tools/abl-tzmap -> target
            tools/canoe-bootmgr -> target
            tools/canoe-fs -> target
            tools/canoe-image -> target
            tools/canoe-provision -> target
      - name: Install only missing host dependencies for selected duties
        if: steps.scope.outputs.apt_packages != ''
        env:
          PACKAGES: ${{ steps.scope.outputs.apt_packages }}
        run: |
          missing=()
          for package in $PACKAGES; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" != installed ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            # Ignore the unused Chrome channel only when apt is needed.
            sudo rm -f /etc/cron.daily/google-chrome /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Check Rust tool contracts
        if: steps.scope.outputs.rust_crates != ''
        env:
          CRATES: ${{ steps.scope.outputs.rust_crates }}
        run: |
          for crate in $CRATES; do
            cargo test --locked --manifest-path "tools/$crate/Cargo.toml"
          done
      - name: Check BDS contracts
        if: steps.scope.outputs.uefi_tests == 'true'
        run: make -C submodules/uefi test
      - name: Check ABL patch contracts
        if: steps.scope.outputs.patcher_tests == 'true'
        run: make -C submodules/patcher test
      - name: Check manager installation
        if: steps.scope.outputs.module_tests == 'true'
        run: sh targets/magisk_module/tests/test_flows.sh
      - name: Check release and import commands
        if: steps.scope.outputs.script_tests == 'true'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Qualify portable image libraries
        if: steps.scope.outputs.portable_crates != ''
        env:
          CRATES: ${{ steps.scope.outputs.portable_crates }}
        run: |
          for crate in $CRATES; do
            cargo check --locked --manifest-path tools/$crate/Cargo.toml --no-default-features --lib --target wasm32-unknown-unknown
          done
          if [[ " $CRATES " == *" canoe-image "* ]]; then
            cargo build --locked --manifest-path tools/canoe-image/qualification/vendorboot/Cargo.toml --target wasm32-unknown-unknown --release
            node tools/canoe-image/qualification/vendorboot/run.mjs
          fi
      - name: Prepare firmware toolchain
        if: steps.scope.outputs.firmware == 'true'
        run: docker build -t gbl_builder .
      - name: Build CANOE-BDS and EFI tools
        if: steps.scope.outputs.firmware == 'true'
        run: |
          docker image inspect gbl_builder --format '{{.Id}}'
          docker run --rm -v "$PWD:/workspace" -w /workspace gbl_builder bash -lc 'make -C submodules/uefi clean && make -C submodules/uefi build && make -C submodules/uefi tools'
      - run: make version-check
        if: steps.scope.outputs.versions == 'true'
      - name: Capture the exact firmware build and source identity
        if: steps.scope.outputs.firmware == 'true'
        run: python3 scripts/firmware_release.py package
      - run: python3 scripts/firmware_release.py verify .work/firmware-release
        if: steps.scope.outputs.firmware == 'true'
      - if: steps.scope.outputs.firmware == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ steps.source.outputs.commit }}
          path: .work/firmware-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
# The app's pinned KSU build drives module packaging with CANOE_KSU_DIST.
# Firmware CI never fetches a legacy WebUI or builds desktop sidecars.
