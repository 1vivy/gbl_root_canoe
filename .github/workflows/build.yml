name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check version consistency
      run: make version-check
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pytest
      run: python3 -m pip install pytest

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lld clang llvm uuid-dev liblzma-dev libext2fs-dev comerr-dev mingw-w64 zip file
    - name: Install Rust targets
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.98.0
        targets: x86_64-pc-windows-gnu,aarch64-linux-android


    - name: Setup Variables
      run: |
        echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Run tests
      run: |
        command -v google-chrome-stable || command -v google-chrome
        make test

    - name: Build Toolkits
      run: |
        bash tools/canoe-ext4/build-windows.sh
        make target_toolkit_linux
        make target_toolkit_windows
        make target_toolkit_android

    - name: Build Magisk Module
      run: |
        make target_magisk_module

    - name: Build VBMeta Fixer
      run: |
        make tools_vbmetafixer_linux
        make tools_vbmetafixer_windows
        make tools_vbmetafixer_android

    - name: Unpack artifacts
      run: |
        mkdir -p artifacts/toolkit_linux artifacts/toolkit_windows artifacts/toolkit_android artifacts/magisk_module
        mkdir -p artifacts/vbmetafixer_linux artifacts/vbmetafixer_windows artifacts/vbmetafixer_android
        unzip targets/toolkit_linux/build/toolkit_linux.zip -d artifacts/toolkit_linux
        unzip targets/toolkit_windows/build/toolkit_windows.zip -d artifacts/toolkit_windows
        unzip targets/toolkit_android/build/toolkit_android.zip -d artifacts/toolkit_android
        unzip targets/magisk_module/build/module_android.zip -d artifacts/magisk_module
        cp -r tools/vbmetafixer/build/toolkit/* artifacts/vbmetafixer_linux/
        cp -r tools/vbmetafixer/build/toolkit_win/* artifacts/vbmetafixer_windows/
        cp -r tools/vbmetafixer/build/toolkit_android/* artifacts/vbmetafixer_android/

    - name: Inspect packaged outputs
      run: |
        test -x artifacts/toolkit_linux/bin/patch_abl
        test -x artifacts/toolkit_linux/bin/mode2_profile
        test -x artifacts/toolkit_linux/bin/abl_tzmap
        test -x artifacts/toolkit_linux/bin/canoe-bootmgr
        test -f artifacts/toolkit_windows/bin/patch_abl.exe
        test -f artifacts/toolkit_windows/bin/mode2_profile.exe
        test -f artifacts/toolkit_windows/bin/abl_tzmap.exe
        test -f artifacts/toolkit_windows/bin/canoe-bootmgr.exe
        test -f artifacts/toolkit_windows/Platform-Tools/fastboot.exe
        test ! -e artifacts/toolkit_windows/Platform-Tools/adb.exe
        test -f artifacts/toolkit_windows/bin/canoe-ext4.exe
        test -x artifacts/toolkit_android/bin/patch_abl
        test -x artifacts/toolkit_android/bin/mode2_profile
        test -x artifacts/toolkit_android/bin/abl_tzmap
        test -x artifacts/toolkit_android/bin/canoe-bootmgr
        test -x artifacts/magisk_module/bin/patch_abl
        test -x artifacts/magisk_module/bin/mode2_profile
        test -x artifacts/magisk_module/bin/abl_tzmap
        test -x artifacts/magisk_module/bin/canoe-bootmgr
        test -x artifacts/toolkit_linux/bin/extractfv
        test -f artifacts/toolkit_windows/bin/extractfv.exe
        test -x artifacts/toolkit_android/bin/extractfv
        test -x artifacts/magisk_module/bin/extractfv
        # One launcher, not four. `canoe` with no arguments is the interactive
        # wizard; `canoe build|install` are the non-interactive subcommands CI
        # and scripts use.
        test -x "artifacts/toolkit_linux/canoe"
        # Both halves must ship: the .cmd only picks the interpreter, and the
        # extensionless file beside it is the script that interpreter runs.
        test -f "artifacts/toolkit_windows/canoe"
        test -f "artifacts/toolkit_windows/canoe.cmd"
        test -f artifacts/toolkit_windows/python/python.exe
        test -f artifacts/toolkit_android/build.sh
        for package in toolkit_linux toolkit_windows; do
          test -d "artifacts/$package/canoelib"
          test -z "$(find "artifacts/$package" -type d -name __pycache__ -print -quit)"
        done
        test -f artifacts/magisk_module/customize.sh
        test -f artifacts/magisk_module/bin/bl_flasher.sh
        test -f artifacts/magisk_module/bin/canoe_vendor_boot.sh
        test -f artifacts/magisk_module/webroot/app.js
        test -f artifacts/magisk_module/webroot/index.html
        test -f artifacts/magisk_module/webroot/style.css
        test -f artifacts/magisk_module/module.prop
        for package in toolkit_linux toolkit_windows toolkit_android magisk_module; do
          test -s "artifacts/$package/BDS.efi"
          test -s "artifacts/$package/efisp/tools/RebootTools.efi"
          test -s "artifacts/$package/efisp/tools/BLTools.efi"
          test -s "artifacts/$package/efisp/tools/ArbTools.efi"
          test -s "artifacts/$package/efisp/tools/SurfaceTools.efi"
        done
        for file in BDS.efi efisp/tools/RebootTools.efi efisp/tools/BLTools.efi efisp/tools/ArbTools.efi efisp/tools/SurfaceTools.efi; do
          cmp "artifacts/toolkit_linux/$file" "artifacts/toolkit_windows/$file"
          cmp "artifacts/toolkit_linux/$file" "artifacts/toolkit_android/$file"
          cmp "artifacts/toolkit_linux/$file" "artifacts/magisk_module/$file"
        done

        linux_patcher_type="$(file -b artifacts/toolkit_linux/bin/patch_abl)"
        case "$linux_patcher_type" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "unexpected Linux patch_abl: $linux_patcher_type"; exit 1 ;;
        esac
        windows_patcher_type="$(file -b artifacts/toolkit_windows/bin/patch_abl.exe)"
        case "$windows_patcher_type" in
          *"PE32+ executable"*"x86-64"*) ;;
          *) echo "unexpected Windows patch_abl: $windows_patcher_type"; exit 1 ;;
        esac
        android_patcher_type="$(file -b artifacts/toolkit_android/bin/patch_abl)"
        case "$android_patcher_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Android toolkit patch_abl: $android_patcher_type"; exit 1 ;;
        esac
        module_patcher_type="$(file -b artifacts/magisk_module/bin/patch_abl)"
        case "$module_patcher_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Magisk patch_abl: $module_patcher_type"; exit 1 ;;
        esac

        linux_profile_type="$(file -b artifacts/toolkit_linux/bin/mode2_profile)"
        case "$linux_profile_type" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "unexpected Linux mode2_profile: $linux_profile_type"; exit 1 ;;
        esac
        linux_tzmap_type="$(file -b artifacts/toolkit_linux/bin/abl_tzmap)"
        case "$linux_tzmap_type" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "unexpected Linux abl_tzmap: $linux_tzmap_type"; exit 1 ;;
        esac
        windows_tzmap_type="$(file -b artifacts/toolkit_windows/bin/abl_tzmap.exe)"
        case "$windows_tzmap_type" in
          *"PE32+ executable"*"x86-64"*) ;;
          *) echo "unexpected Windows abl_tzmap: $windows_tzmap_type"; exit 1 ;;
        esac
        android_tzmap_type="$(file -b artifacts/toolkit_android/bin/abl_tzmap)"
        case "$android_tzmap_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Android toolkit abl_tzmap: $android_tzmap_type"; exit 1 ;;
        esac
        module_tzmap_type="$(file -b artifacts/magisk_module/bin/abl_tzmap)"
        case "$module_tzmap_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Magisk abl_tzmap: $module_tzmap_type"; exit 1 ;;
        esac
        windows_profile_type="$(file -b artifacts/toolkit_windows/bin/mode2_profile.exe)"
        case "$windows_profile_type" in
          *"PE32+ executable"*"x86-64"*) ;;
          *) echo "unexpected Windows mode2_profile: $windows_profile_type"; exit 1 ;;
        esac
        android_profile_type="$(file -b artifacts/toolkit_android/bin/mode2_profile)"
        case "$android_profile_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Android toolkit mode2_profile: $android_profile_type"; exit 1 ;;
        esac
        module_profile_type="$(file -b artifacts/magisk_module/bin/mode2_profile)"
        case "$module_profile_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Magisk mode2_profile: $module_profile_type"; exit 1 ;;
        esac
        linux_bootmgr_type="$(file -b artifacts/toolkit_linux/bin/canoe-bootmgr)"
        case "$linux_bootmgr_type" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "unexpected Linux canoe-bootmgr: $linux_bootmgr_type"; exit 1 ;;
        esac
        windows_bootmgr_type="$(file -b artifacts/toolkit_windows/bin/canoe-bootmgr.exe)"
        case "$windows_bootmgr_type" in
          *"PE32+ executable"*"x86-64"*) ;;
          *) echo "unexpected Windows canoe-bootmgr: $windows_bootmgr_type"; exit 1 ;;
        esac
        android_bootmgr_type="$(file -b artifacts/toolkit_android/bin/canoe-bootmgr)"
        case "$android_bootmgr_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Android toolkit canoe-bootmgr: $android_bootmgr_type"; exit 1 ;;
        esac
        module_bootmgr_type="$(file -b artifacts/magisk_module/bin/canoe-bootmgr)"
        case "$module_bootmgr_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Magisk canoe-bootmgr: $module_bootmgr_type"; exit 1 ;;
        esac
        linux_extractfv_type="$(file -b artifacts/toolkit_linux/bin/extractfv)"
        case "$linux_extractfv_type" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "unexpected Linux extractfv: $linux_extractfv_type"; exit 1 ;;
        esac
        windows_extractfv_type="$(file -b artifacts/toolkit_windows/bin/extractfv.exe)"
        case "$windows_extractfv_type" in
          *"PE32+ executable"*"x86-64"*) ;;
          *) echo "unexpected Windows extractfv: $windows_extractfv_type"; exit 1 ;;
        esac
        android_extractfv_type="$(file -b artifacts/toolkit_android/bin/extractfv)"
        case "$android_extractfv_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Android toolkit extractfv: $android_extractfv_type"; exit 1 ;;
        esac
        module_extractfv_type="$(file -b artifacts/magisk_module/bin/extractfv)"
        case "$module_extractfv_type" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "unexpected Magisk extractfv: $module_extractfv_type"; exit 1 ;;
        esac

        for efi in BDS.efi efisp/tools/RebootTools.efi efisp/tools/BLTools.efi efisp/tools/ArbTools.efi efisp/tools/SurfaceTools.efi; do
          efi_type="$(file -b "artifacts/toolkit_linux/$efi")"
          # file(1) renamed the PE machine string for this architecture from
          # "ARM64" to "Aarch64"; a runner-image bump must not fail a correct
          # binary, so accept either spelling.
          case "$efi_type" in
            *"PE32+ executable"*"EFI"*"ARM64"*) ;;
            *"PE32+ executable"*"EFI"*"Aarch64"*) ;;
            *) echo "unexpected ARM64 EFI binary $efi: $efi_type"; exit 1 ;;
          esac
        done

    - name: Package release archives
      run: |
        # Zip here, in the job that produced the tree. Artifact upload/download
        # does not preserve the executable bit, so zipping after that round-trip
        # publishes mode-644 scripts and binaries: `./canoe` fails with
        # Permission denied and bin/* cannot be exec'd even via `bash canoe`.
        # A zip stores the modes itself, and uploading the zip round-trips its
        # bytes intact.
        mkdir -p release
        for package in toolkit_linux toolkit_windows toolkit_android magisk_module \
                       vbmetafixer_linux vbmetafixer_windows vbmetafixer_android; do
          ( cd "artifacts/$package" && zip -qr "../../release/$package.zip" . )
        done
        for package in toolkit_linux toolkit_windows; do
          archive_entries="$(unzip -Z1 "release/$package.zip")"
          case "$archive_entries" in
            *__pycache__*) echo "__pycache__ leaked into $package archive"; exit 1 ;;
          esac
        done

        # The archive is the deliverable, so assert the modes inside the archive
        # rather than in the build tree they came from.
        rm -rf modecheck && unzip -q -o release/toolkit_linux.zip -d modecheck
        for exe in canoe \
                   bin/patch_abl bin/mode2_profile bin/abl_tzmap \
                   bin/canoe-bootmgr bin/extractfv \
                   bin/vbmetaport bin/vbmetabackup; do
          test -x "modecheck/$exe" || { echo "not executable in archive: $exe"; exit 1; }
        done
        rm -rf modecheck


    # Each artifact carries the packaged .zip, not the loose tree: the zip is
    # what preserves the executable bit across the artifact round-trip.
    - name: Upload Linux Toolkit
      uses: actions/upload-artifact@v4
      with:
        name: toolkit_linux
        path: release/toolkit_linux.zip

    - name: Upload Windows Toolkit
      uses: actions/upload-artifact@v4
      with:
        name: toolkit_windows
        path: release/toolkit_windows.zip

    - name: Upload Android Toolkit
      uses: actions/upload-artifact@v4
      with:
        name: toolkit_android
        path: release/toolkit_android.zip

    - name: Upload Magisk Module
      uses: actions/upload-artifact@v4
      with:
        name: magisk_module
        path: release/magisk_module.zip

    - name: Upload VBMeta Fixer Linux
      uses: actions/upload-artifact@v4
      with:
        name: vbmetafixer_linux
        path: release/vbmetafixer_linux.zip

    - name: Upload VBMeta Fixer Windows
      uses: actions/upload-artifact@v4
      with:
        name: vbmetafixer_windows
        path: release/vbmetafixer_windows.zip

    - name: Upload VBMeta Fixer Android
      uses: actions/upload-artifact@v4
      with:
        name: vbmetafixer_android
        path: release/vbmetafixer_android.zip
