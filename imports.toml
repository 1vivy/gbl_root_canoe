"Application/SurfaceTools/SurfaceTools.inf" = "0.2"
"Application/UsbTools/UsbTools.inf" = "0.1"
"Library/AndroidToolsUi/AndroidToolsUi.inf" = "0.1"
"Library/MdTableLib/MdTableLib.inf" = "0.1"

[[import]]
id = "desktop-app-linux"
kind = "external"
why = "Operator-supplied canoe-boot-manager Linux binary from a sibling checkout."
path_var = "CANOE_APP_LINUX_BIN"
note = "Supply the Linux binary from canoe-boot-manager; it is not committed or hashable here."
[import.producer]
repo = "canoe-boot-manager"
command = "bunx tauri build --no-bundle --ci"

[[import]]
id = "desktop-app-windows"
kind = "external"
why = "Operator-supplied canoe-boot-manager Windows binary from a sibling checkout."
path_var = "CANOE_APP_WINDOWS_BIN"
note = "Supply the x86_64-pc-windows-gnu binary from canoe-boot-manager; it is not committed or hashable here."
[import.producer]
repo = "canoe-boot-manager"
command = "bunx tauri build --target x86_64-pc-windows-gnu --no-bundle --ci"
