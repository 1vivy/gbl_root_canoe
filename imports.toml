exclude = ["QcomModulePkg", "AndroidToolsPkg"]
imported_at = "2f5339b"
local_patches = true
[import.upstream]
url = "https://git.codelinaro.org/clo/la/abl/tianocore/edk2"
rev = "unknown"

[[import]]
id = "ablrepo"
kind = "data"
why = "Foreign per-product ABL candidates and their recorded digests and metadata."
path = "ablrepo"
entry_image = "abl.img"
entry_digest = "abl.sha256"
entry_meta = "abl.meta"

[[import]]
id = "android-efi-tools"
kind = "satellite"
why = "AndroidToolsPkg project versioned independently from CANOE_VERSION."
