schema = 1

[[import]]
id = "webui"
kind = "artifact"
why = "Checked-in Web UI archive from canoe-boot-manager; its digest currently matches the checked-in archive."
path = "targets/magisk_module/webui-cache/canoe-boot-manager-0.1.0.tar.gz"
version = "0.1.0"
url = "file://$(CANOE_ROOT_DIR)/targets/magisk_module/webui-cache/canoe-boot-manager-0.1.0.tar.gz"
sha256 = "ae0d34452a0fb301dce993aaca98665a88d14ccdc574d736215f2e35603e4efd"
bytes = 191986
make_prefix = "CANOE_WEBUI"
[import.producer]
repo = "canoe-boot-manager"
command = "bun run build, then make -C targets/magisk_module webui-pin CANOE_WEBUI_SRC=../../../canoe-boot-manager"

