[[import]]
id = "ksu-app"
kind = "external"
why = "Explicit version-matched KSU application assets, never the hosted bundle."
path_var = "CANOE_KSU_DIST"
note = "Stage a local dist/ksu whose manifest declares product, version and runtime=ksu."
[import.producer]
repo = "https://github.com/1vivy/canoe-boot-manager.git"
command = "Build the b5 KSU target to dist/ksu"
