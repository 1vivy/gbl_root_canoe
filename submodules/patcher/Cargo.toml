[package]
name = "abl_patch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Canonical ABL patcher as a bounded native/WASM byte library"

[lib]
path = "portable/lib.rs"

[dependencies]
abl_extract = { path = "../ablfvextractor" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
