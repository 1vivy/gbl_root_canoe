[package]
name = "canoe_image"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Canoe image inspection and preparation"

[[bin]]
name = "canoe-image"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "native"]
native = ["dep:canoe_fs", "dep:wait-timeout", "dep:tempfile", "dep:same-file", "dep:lz4", "dep:flate2", "mode2_profile/native"]

[dependencies]
canoe_fs = { path = "../canoe-fs", optional = true }
mode2_profile = { path = "../mode2-profile", default-features = false }
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
wait-timeout = { version = "0.2", optional = true }
tempfile = { version = "3", optional = true }
same-file = { version = "1", optional = true }
lz4 = { version = "1", optional = true }
flate2 = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
