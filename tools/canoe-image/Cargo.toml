[package]
name = "canoe_image"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Canoe image inspection and preparation"

[[bin]]
name = "canoe-image"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
canoe_fs = { path = "../canoe-fs" }
mode2_profile = { path = "../mode2-profile", default-features = false }
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
wait-timeout = "0.2"
tempfile = "3"
same-file = "1"
lz4 = "1"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
