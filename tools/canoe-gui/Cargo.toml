[package]
name = "canoe-gui"
version = "7.0.0-beta.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Canoe host boot-entry manager GUI"

[[bin]]
name = "canoe-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
