# Tooling config for the canoe host tools. There is deliberately no [project]
# table and no dependency list: this tree is copied verbatim into both toolkit
# archives and runs on the host's python3 (Linux) or the embeddable CPython
# shipped beside it (Windows). That runtime has no pip and no site-packages, so
# the shipped code is stdlib-only. pytest is a development dependency of the
# tests, which are never packaged.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The launchers must extend sys.path before importing the package they ship
  # beside; the import cannot precede it.
  "E402",
  # Operator-facing CLI output is the product here, not a logging concern.
  "T201",
  # The error text IS the user interface. Hoisting every message into a local
  # or an exception subclass buys nothing and hides what the operator will see.
  "TRY003", "EM101", "EM102",
  # Runtime-needed imports stay at module scope; TYPE_CHECKING blocks would
  # only shuffle them for a stdlib import that is already free.
  "TC001", "TC003",
  # Property docstrings are noun phrases, which is correct English for a
  # property and what D401 objects to.
  "D401", "D107",
  # Device-side paths under /tmp are the device's, not host temporaries.
  "S108",
  # No copyright headers anywhere in this repository.
  "CPY001",
  # Long-form module docstrings carry the rationale these tools are reviewed on.
  "D203", "D213",
  # `subprocess` with an argv list is the point: no shell, no quoting.
  "S404",
  # COM812/ISC001 fight the formatter.
  "COM812", "ISC001",
  # The operator reports are bilingual; fullwidth punctuation is correct
  # Chinese typography, not a homoglyph mistake.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The launcher runtime guard must stay live for hosts older than the floor,
# which is exactly the version ruff considers already satisfied.
"canoe/__init__.py" = ["UP036"]
"tests/**" = ["S101", "PLR2004", "SLF001", "D", "ARG", "INP001", "S603", "S607"]
"tests/stubs/*" = ["ALL"]
"canoe_build" = ["INP001"]
"canoe_prep" = ["INP001"]
"canoe_prep_device" = ["INP001"]
"canoe_stage" = ["INP001"]

[tool.basedpyright]
include = ["canoe", "tests"]
exclude = ["tests/stubs"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportMissingTypeStubs = false
# Every print(), write_text() and mkdir() returns something. Requiring `_ =`
# on each one buys no safety and hides the calls that matter.
reportUnusedCallResult = false
# The launcher version guard is dead code at the declared floor and live code
# on the older hosts it exists to give a readable message to.
reportUnreachable = false

