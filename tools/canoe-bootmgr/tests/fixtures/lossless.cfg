# comments are parser-only
version 1
generation 4
timeout 5
legacy-global keep-me
mode 1
devinfo-repair asneeded

default android-a
entry android-a
  title Android (slot A)
  image /boot_a.efi
  options --android
  x-hand-row preserve-me
  mode 1
  role active

entry lineage
  title LineageOS
  image roms/lineage.efi
  options root=/dev/foo
  mode 2
  role other
