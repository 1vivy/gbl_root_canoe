[package]
name = "canoe_bootmgr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Canoe boot-root configuration and entry manager"

[lib]
name = "canoe_bootmgr"
path = "src/lib.rs"

[[bin]]
name = "canoe-bootmgr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_Security",
] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
