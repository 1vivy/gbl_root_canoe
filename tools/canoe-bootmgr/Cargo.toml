[package]
name = "canoe_bootmgr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Canoe boot-root configuration and entry manager"

[lib]
name = "canoe_bootmgr"
path = "src/lib.rs"

[[bin]]
name = "canoe-bootmgr"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
# Harness-only seams: CANOE_BLOCK_BY_NAME_ROOT redirects partition nodes to a
# directory of regular files and CANOE_BLOCK_WRITE_FAULT injects the block
# write test faults. Never enabled in a shipped build.
test-seams = []

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
]}
sha2 = "0.10"
wait-timeout = "0.2"
tempfile = "3"
mode2_profile = { path = "../mode2-profile" }
lz4 = "1"
flate2 = "1"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "fs"] }

