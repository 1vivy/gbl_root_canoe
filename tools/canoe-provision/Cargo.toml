[package]
name = "canoe_provision"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Provision a Canoe FAT container on supplied persist storage"
build = "build.rs"

[[bin]]
name = "canoe-provision"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "native"]
native = ["dep:tempfile"]
# Historical helper integration is opt-in; b5 does not ship that helper.
legacy-ext4-tests = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fatfs = { git = "https://github.com/1vivy/rust-fatfs", rev = "a8cdf82d9b1a8b4125197c20d320d35df646f64d", default-features = false, features = ["std", "alloc", "lfn", "unicode"] }
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
