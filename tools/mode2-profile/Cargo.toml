[package]
name = "mode2_profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "GM2P profile derivation and validation utility"

[lib]
name = "mode2_profile"
path = "src/lib.rs"

[[bin]]
name = "mode2_profile"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
canoe_fs = { path = "../canoe-fs" }
clap = { version = "4.5", features = ["derive"], optional = true }
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
